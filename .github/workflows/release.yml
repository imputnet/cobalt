
jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Validate release version
        run: |
          version=$(node -p "require('./api/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $GITHUB_REF_NAME is not a stable semantic version tag" >&2
            exit 1
          fi

          if [[ "$version" != "$tag_version" ]]; then
            echo "tag v$tag_version does not match api/package.json version $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
        shell: bash

      - env:
          VERSION: ${{ steps.version.outputs.version }}
        name: Create source archive
        run: |
          archive="cobalt-${VERSION}.tar.gz"
          prefix="cobalt-${VERSION}/"
          git archive --format=tar.gz --prefix="$prefix" --output="$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
        shell: bash

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        name: Publish GitHub release
        run: |
          archive="cobalt-${VERSION}.tar.gz"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
              --verify-tag \
              --title "cobalt ${VERSION}" \
              --generate-notes
          fi

name: Create source release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
